name: Pipeline Docker - Entrega Contínua

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: docker-teste:latest

jobs:
  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do GitHub
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build --pull -t $IMAGE_NAME .

      - name: Salvar imagem como artefato
        run: docker save -o docker-image.tar $IMAGE_NAME

      - name: Publicar artefato da imagem
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar

  test:
    name: Testar a imagem Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Baixar artefato da imagem
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: docker load --input docker-image.tar

      - name: Executar container de teste
        run: docker run -d --rm --name meu-container -p 8080:80 $IMAGE_NAME

      - name: Aguardar inicialização do container
        run: sleep 5

      - name: Verificar container
        run: docker ps --filter "name=meu-container"

      - name: Testar NGINX
        run: curl --fail --silent --show-error http://localhost:8080

      - name: Limpar container
        if: always()
        run: docker rm -f meu-container
